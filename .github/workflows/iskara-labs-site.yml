name: Iskara Labs Site

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/iskara-labs-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/iskara-labs-site.yml"

permissions:
  contents: read

concurrency:
  group: iskara-labs-site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  verify:
    name: typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify
        run: npm run check
