name: Iskara Labs Site

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/iskara-labs-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/iskara-labs-site.yml"

permissions:
  contents: read

concurrency:
  group: iskara-labs-site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  verify:
    name: contracts · typecheck · build · browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify contracts, types and production build
        run: npm run check

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Browser regression — routes and responsive layout
        run: npm run test:e2e
